<app-header />
<main class="contenido">
  <router-outlet />
</main>

@if (authService.avisoSesion()) {
  <app-modal
    titulo="Tu sesión está por vencer"
    mensaje="Te quedan 1 minuto de sesión. ¿Querés extenderla?"
    textoAceptar="Extender"
    [mostrarCancelar]="true"
    (cerrar)="extender()"
    (cancelar)="authService.avisoSesion.set(false)"
  />
}
