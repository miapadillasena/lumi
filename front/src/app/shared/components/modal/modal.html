<div class="fondo" (click)="cerrarDesdeFondo()">
  <div class="modal" [class.error]="tipo === 'error'" (click)="$event.stopPropagation()">
    <h3>{{ titulo }}</h3>
    <p>{{ mensaje }}</p>
    <div class="botones">
      @if (mostrarCancelar) {
        <button type="button" class="secundario" (click)="cancelar.emit()">Cancelar</button>
      }
      <button type="button" (click)="cerrar.emit()">{{ textoAceptar }}</button>
    </div>
  </div>
</div>
